[project]
name = "callwrap-ai"
version = "0.2.0"
description = "CallWrap AI 분석 패키지 — analyze(Transcript) -> AnalysisResult"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/callwrap_ai"]
